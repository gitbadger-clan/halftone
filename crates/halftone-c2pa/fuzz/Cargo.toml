# Fuzz targets for halftone-c2pa (cargo-fuzz; needs a nightly toolchain).
#
#   cargo install cargo-fuzz
#   cd crates/halftone-c2pa/fuzz
#   cargo fuzz run evaluate_table -- -max_total_time=600
#   cargo fuzz run evaluate_json  -- -max_total_time=600
#
# Its own workspace, so the main build never compiles libFuzzer.
[package]
name = "halftone-c2pa-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
serde_json = "1"
# Default features: the multi-asset procedure needs no c2pa build.
halftone-c2pa = { path = ".." }

[[bin]]
name = "evaluate_table"
path = "fuzz_targets/evaluate_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "evaluate_json"
path = "fuzz_targets/evaluate_json.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
