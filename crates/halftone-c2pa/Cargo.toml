[package]
name = "halftone-c2pa"
description = "Layer 1: C2PA manifest validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
halftone-core.workspace = true
halftone-packs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
hex.workspace = true
sha2.workspace = true
c2pa = { workspace = true, optional = true }
# Remote-manifest fetch client with a timeout and HTTPS-only redirects; used only
# when `C2paSource::fetch_remote_manifests` is set.
ureq = { workspace = true, optional = true }
# The signing certificate's serial and validity window (`shelf_life`).
x509-parser = { workspace = true, optional = true }
halftone-rubric.workspace = true
halftone-formats.workspace = true



[features]
# Real manifest validation via the `c2pa` crate. Off by default in this library
# because the crate is heavy; the CLI (`halftone-cli`) turns it on by default. Without
# it the source reports NotApplicable.
c2pa = ["dep:c2pa", "dep:ureq", "dep:x509-parser", "c2pa/fetch_remote_manifests"]

[lints]
workspace = true
