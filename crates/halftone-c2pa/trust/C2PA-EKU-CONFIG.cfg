// Extended key usages Halftone accepts on a manifest signing certificate.
// Passed to c2pa as `trust.trust_config` (DIFFERENTIAL.md D-011).
//
// c2pa 0.91 clears its built-in allow-list when a Context is built and re-adds
// only this setting, so without it a signer passes only with emailProtection,
// timeStamping or OCSPSigning. This list is c2pa-rs's own default
// (sdk/src/crypto/cose/valid_eku_oids.cfg, identical in 0.90.20 and 0.91.0),
// made explicit so a verdict records the EKU policy it was judged under.
// Review against the C2PA signer certificate profile before changing it.
//
// Format: one dotted OID per line; any other line (like this one) is ignored.

