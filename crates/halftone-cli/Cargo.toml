[package]
name = "halftone-cli"
description = "Halftone: layered provenance and forensics for image, video, audio and text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ht"
path = "src/main.rs"

[[test]]
name = "differential"
required-features = ["c2pa"]

[dependencies]
halftone-core.workspace = true
halftone-c2pa.workspace = true
halftone-container.workspace = true
halftone-mark.workspace = true
halftone-blind.workspace = true
halftone-bench.workspace = true
halftone-packs = { workspace = true, features = ["net"] }
halftone-report.workspace = true
halftone-pixel.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Enable real C2PA validation (heavy dependency).
c2pa = ["halftone-c2pa/c2pa"]

[lints]
workspace = true

