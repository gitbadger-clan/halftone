[package]
name = "halftone-cli"
description = "ht: reads C2PA manifests and the file structure and metadata of images, layer by layer, with no merged score"
version.workspace = true
edition.workspace = true
# c2pa declares Rust 1.96 (every release from 0.91.0 to 0.92.2), and c2pa is a default
# feature here. (The `pdf` feature alone would need 1.92.)
rust-version = "1.96"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "ht"
path = "src/main.rs"

[[test]]
name = "differential"
required-features = ["c2pa"]

[dependencies]
halftone-core.workspace = true
halftone-c2pa.workspace = true
halftone-container.workspace = true
halftone-mark.workspace = true
halftone-blind.workspace = true
halftone-bench.workspace = true
halftone-packs = { workspace = true, features = ["net"] }
halftone-report.workspace = true
halftone-pixel.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
image.workspace = true
serde_json.workspace = true

[features]
default = ["c2pa"]
# C2PA manifest validation (the manifest layer). On by default: a build without it
# (`--no-default-features`) reads no manifest and says so in every inspection. A
# heavy dependency.
c2pa = ["halftone-c2pa/c2pa"]
# `ht inspect --pdf`: reports typeset in-process. A heavy dependency.
pdf = ["halftone-report/pdf"]

[lints]
workspace = true
