[package]
name = "halftone-packs"
description = "Signed model-pack download, verification and license checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# halftone-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# tracing.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
ureq = { workspace = true, features = ["rustls", "gzip"], optional = true }
hex.workspace = true
thiserror.workspace = true
tar = "0.4"
zstd = "0.14"


[features]
default = []
# Network fetch for `packs update`. Off by default so library users stay offline;
# the CLI turns it on.
net = ["dep:ureq"]

[lints]
workspace = true
