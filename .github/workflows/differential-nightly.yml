# Nightly differential run on the self-hosted runner, which has the private strata
# (04-generators, 05-fold, 06-phones, …) on disk under corpus/differential/.
#
# Unlike the push/PR job this one is allowed to drift on purpose: the public strata
# are re-fetched at upstream HEAD, and the reference tools (exiftool, c2patool,
# Credentio, the conformance-public checkout) are whatever the runner has installed.
# Every stratum is re-collected with the references its committed header records
# (scripts/collect.py), so a red night means one of three things:
#   - upstream fixtures moved     -> uv run scripts/refresh-public-strata.py locally, bump the pins
#   - a reference tool moved      -> re-collect the affected strata, commit the diff + a D-entry
#   - Halftone regressed          -> the disagreement table is the bug report
# Never fix a red night by editing expectations.json on an unrelated PR branch.
name: differential-nightly

on:
  # schedule:
  #   - cron: "0 3 * * *"        # 03:00 UTC, before the working day in Zurich
  workflow_dispatch:

concurrency:
  group: differential-nightly
  cancel-in-progress: false

env:
  # Every `uv run` uses the script's committed lock file.
  UV_LOCKED: "1"
  # Where the runner keeps the references collect.py passes to the collector for
  # strata recorded with them (01, 04, 06, 07, 08). Adjust to the runner's paths.
  CREDENTIO: /opt/credentio/c2pa_validate
  RUBRICS: /opt/conformance-public

jobs:
  all-strata:
    runs-on: [self-hosted, nightly]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false            # keep corpus/differential/* (ignored files) between runs

      - name: Reference tools
        # Lists every tool; fails if a required one (uv, git, exiftool, c2patool,
        # openssl) is missing. Credentio and the conformance-public checkout are
        # checked by collect.py before it collects anything.
        run: uv run scripts/bootstrap.py --tools

      - name: Rebuild public strata at upstream HEAD
        run: uv run scripts/refresh-public-strata.py --no-test

      - name: Re-collect private strata
        run: |
          strata=()
          for d in corpus/differential/[0-9][0-9]-*/; do
            name=$(basename "$d")
            # Public strata were just handled; private ones are anything else with files.
            case "$name" in 00-base|01-c2pa-rs|02-exiftool|03-synthetic) continue ;; esac
            if find "$d" -maxdepth 1 -type f ! -name 'expectations.json' ! -name 'cases.json' \
                 ! -name 'SOURCE.txt' ! -name 'SOURCE.md' ! -name '*.json' | grep -q .; then
              strata+=("$name")
            fi
          done
          echo "private strata on disk: ${strata[*]:-none}"
          # A stratum with files but no expectations.json yet (a new one) is collected
          # as new, with Credentio and the rubrics; the rest keep their recorded inputs.
          if [ ${#strata[@]} -gt 0 ]; then
            uv run scripts/collect.py "${strata[@]}"
          fi

      - name: Differential test (every stratum on disk)
        run: cargo test -p halftone-cli --features c2pa --test differential -- --ignored --nocapture

      - name: Ground truth drift
        if: always()
        run: |
          echo "## Ground truth changed tonight" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git status --short -- corpus/differential >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff --stat -- corpus/differential >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep tonight's expectations as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: differential-expectations-${{ github.run_id }}
          path: |
            corpus/differential/*/expectations.json
            corpus/differential/*/SOURCE.txt
          retention-days: 30
