# Differential test on the public strata (01 c2pa-rs fixtures, 02 ExifTool test
# images, 03 synthetic). Ground truth (expectations.json, cases.json) is committed;
# the files are rebuilt from pinned upstream commits, so neither c2patool nor the
# network at inspection time is involved. Private strata (04+) run on the
# self-hosted nightly runner, which has the corpus on disk.
name: differential

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Full shas; keep in step with corpus/differential/*/SOURCE.txt
  # (scripts/refresh-public-strata.py prints both after a run).
  C2PA_FIXTURES_COMMIT: 8641fbac3971dc7163c4ba67d8c588f62c99761b
  EXIFTOOL_FIXTURES_COMMIT: 2200871d9cef988051d2a99d67df3bda6cbb30a8
  # Every `uv run` uses the script's committed lock file and fails if it is
  # missing or out of date (scripts/bootstrap.py writes them).
  UV_LOCKED: "1"

jobs:
  public-strata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2

      - name: System tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # Script environments are built once per lock-file change, then restored.
          enable-cache: true
          cache-dependency-glob: scripts/*.lock

      - name: Cache public fixtures
        id: fixtures
        uses: actions/cache@v6
        with:
          # Only the fetched files belong in the cache. Ground truth is committed
          # and must come from the checkout, never from an older run's archive.
          path: |
            corpus/differential/01-c2pa-rs
            corpus/differential/02-exiftool
            !corpus/differential/*/expectations.json
            !corpus/differential/*/cases.json
            !corpus/differential/*/SOURCE.txt
          # v3: fetch-fixtures.py decides which files are kept and how they are
          # named, so a change to it must not be answered from an older archive.
          # v2: the v1 archive (2026-09-24) carried that day's expectations.json.
          key: fixtures-v3-${{ env.C2PA_FIXTURES_COMMIT }}-${{ env.EXIFTOOL_FIXTURES_COMMIT }}-${{ hashFiles('scripts/fetch-fixtures.py') }}

      - name: Fetch public fixtures (pinned)
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: |
          uv run scripts/fetch-fixtures.py c2pa-rs --commit "$C2PA_FIXTURES_COMMIT"
          uv run scripts/fetch-fixtures.py exiftool --commit "$EXIFTOOL_FIXTURES_COMMIT"

      - name: Generate synthetic stratum
        run: uv run scripts/gen-synthetic.py --refresh

      - name: Check public strata are complete
        # Ground truth must be committed AND the files must be on disk: the test
        # skips a stratum whose files are entirely absent (that is how private
        # strata stay out of CI), so an unfetched public stratum would otherwise
        # pass silently.
        run: |
          for d in 01-c2pa-rs 02-exiftool 03-synthetic; do
            test -f "corpus/differential/$d/expectations.json" || { echo "missing corpus/differential/$d/expectations.json (run uv run scripts/refresh-public-strata.py and commit it)"; exit 1; }
            n=$(find "corpus/differential/$d" -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.heic' -o -iname '*.heif' -o -iname '*.avif' \) | wc -l)
            test "$n" -gt 0 || { echo "corpus/differential/$d has no image files; fetch/generate step failed"; exit 1; }
            echo "$d: $n files"
          done

      - name: Committed ground truth wins over the cache
        # A cache restore unpacks over the checkout; put the tracked files back.
        # Also restores the committed cases.json, which gen-synthetic.py rewrites.
        run: git checkout -- corpus/differential

      - name: Differential test
        run: cargo test -p halftone-cli --features c2pa --test differential -- --ignored --nocapture
