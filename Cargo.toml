[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/gitbadger/halftone"
homepage = "https://halftone.gitbadger.com"

[workspace.dependencies]
# internal
halftone-core = { path = "crates/halftone-core", version = "0.1.0" }
halftone-c2pa = { path = "crates/halftone-c2pa", version = "0.1.0" }
halftone-container = { path = "crates/halftone-container", version = "0.1.0" }
halftone-mark = { path = "crates/halftone-mark", version = "0.1.0" }
halftone-blind = { path = "crates/halftone-blind", version = "0.1.0" }
halftone-bench = { path = "crates/halftone-bench", version = "0.1.0" }
halftone-packs = { path = "crates/halftone-packs", version = "0.1.0" }
halftone-report = { path = "crates/halftone-report", version = "0.1.0" }
halftone-pixel = { path = "crates/halftone-pixel", version = "0.1.0" }

# shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.11"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
c2pa = "0.90"
ort = "2.0.0-rc.9"
ndarray = "0.17"
rustfft = "6"
hound = "3"
symphonia = "0.6"
ed25519-dalek = "3"
criterion = "0.8"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
