[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/gitbadger/halftone"
homepage = "https://halftone.gitbadger.com"

[workspace.dependencies]
# internal
halftone-core = { path = "crates/halftone-core", version = "0.1.0" }
halftone-c2pa = { path = "crates/halftone-c2pa", version = "0.1.0" }
halftone-container = { path = "crates/halftone-container", version = "0.1.0" }
halftone-mark = { path = "crates/halftone-mark", version = "0.1.0" }
halftone-blind = { path = "crates/halftone-blind", version = "0.1.0" }
halftone-bench = { path = "crates/halftone-bench", version = "0.1.0" }
halftone-packs = { path = "crates/halftone-packs", version = "0.1.0" }
halftone-report = { path = "crates/halftone-report", version = "0.1.0" }
halftone-pixel = { path = "crates/halftone-pixel", version = "0.1.0" }

# shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.11"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# Dynamic (runtime) shell completion: `COMPLETE=<shell> ht`.
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
c2pa = "0.90.20"
c2pa_cbor = "^0.77.4"
# Same major as c2pa's own HTTP client, so `ureq::Agent` is the type c2pa implements
# its resolver trait for. No features of our own: c2pa already enables rustls.
ureq = { version = "3.4", default-features = false }
ed25519-dalek = "3"


# Reserved: no crate uses these yet. Uncomment here together with the crate-level line.
# ort = "2.0.0-rc.9"     # blind FeatureProbe encoder + head; mark AudioSeal/VideoSeal (check for a newer 2.0 first)
# ndarray = "0.17"       # input tensors for ort
# rustfft = "6"          # frequency-domain watermark checks in halftone-mark
# hound = "3"            # WAV input for audio mark checks
# symphonia = "0.6"      # compressed audio decode (MP3/AAC/FLAC) for audio mark checks
# criterion = "0.8"      # perf benches once throughput matters (batch inspect, pixel decode)

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
