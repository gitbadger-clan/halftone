[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/gitbadger/halftone"
homepage = "https://halftone.gitbadger.com"

[workspace.dependencies]
# internal
halftone-core = { path = "crates/halftone-core", version = "0.1.0" }
halftone-c2pa = { path = "crates/halftone-c2pa", version = "0.1.0" }
halftone-container = { path = "crates/halftone-container", version = "0.1.0" }
halftone-mark = { path = "crates/halftone-mark", version = "0.1.0" }
halftone-blind = { path = "crates/halftone-blind", version = "0.1.0" }
halftone-bench = { path = "crates/halftone-bench", version = "0.1.0" }
halftone-packs = { path = "crates/halftone-packs", version = "0.1.0" }
halftone-report = { path = "crates/halftone-report", version = "0.1.0" }
halftone-pixel = { path = "crates/halftone-pixel", version = "0.1.0" }
halftone-rubric = { path = "crates/halftone-rubric", version = "0.1.0" }
halftone-formats = { path = "crates/halftone-formats", version = "0.1.0" }

# shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.11"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# Dynamic (runtime) shell completion: `COMPLETE=<shell> ht`.
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
# Inflate only, for the zlib streams of a PNG's iCCP and compressed text chunks
# (halftone-container). Pure Rust, and already in the build: `image`'s PNG decoder
# brings this version in through `flate2`. (`png` also uses 0.8 directly, so the lock
# file holds both whichever one is asked for here.)
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
# The PDF report (halftone-report's `pdf` feature). Pinned exactly: the three crates
# are released together and their API moves between minor versions. The fonts are
# our own copies (crates/halftone-report/fonts/), not typst-assets' `fonts` feature.
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
c2pa = "0.92"
# Same major as c2pa's own HTTP client, so `ureq::Agent` is the type c2pa implements
# its resolver trait for. No features of our own: c2pa already enables rustls.
ureq = { version = "3.5", default-features = false }
ed25519-dalek = "3"
# Same version as c2pa's own dependency, so the build has one copy. Used only to
# read the signing certificate's serial and validity window (halftone-c2pa).
x509-parser = "0.18"

yaml-rust2 = "0.13"

# Reserved: no crate uses these yet. Uncomment here together with the crate-level line.
# ort = "2.0.0-rc.9"     # blind FeatureProbe encoder + head; mark AudioSeal/VideoSeal (check for a newer 2.0 first)
# ndarray = "0.17"       # input tensors for ort
# rustfft = "6"          # frequency-domain watermark checks in halftone-mark
# hound = "3"            # WAV input for audio mark checks
# symphonia = "0.6"      # compressed audio decode (MP3/AAC/FLAC) for audio mark checks
# criterion = "0.8"      # perf benches once throughput matters (batch inspect, pixel decode)

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
