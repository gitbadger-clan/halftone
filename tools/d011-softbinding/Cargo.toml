[package]
name = "d011-softbinding"
version = "0.0.0"
edition = "2024"
publish = false
description = "D-011: print the decode error c2pa 0.91 discards on soft-binding assertions"

# Standalone: not a member of the Halftone workspace, like tools/d011-repro.
[workspace]

[dependencies]
# Exactly the versions in the workspace Cargo.lock (preflight step 2 compares them):
# the probe must decode with the library Halftone runs. D-011 was measured on
# c2pa 0.91.1 with c2pa_cbor 0.78.0.
c2pa = "=0.92.2"
c2pa_cbor = "=0.78.2"
serde_path_to_error = "0.1.20"
anyhow = "1"
